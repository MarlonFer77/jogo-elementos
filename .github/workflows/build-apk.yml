name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Runners are efêmeros — sem isso, o Gradle gera um keystore de debug
      # novo (chave aleatória) a cada execução, e cada APK fica com uma
      # assinatura diferente do anterior. Isso quebra qualquer instalação
      # "por cima" de uma versão já instalada (Android recusa update com
      # assinatura diferente) — ver DECISION-039. Cache fixa a mesma chave
      # entre execuções: a primeira execução depois deste passo gera o
      # keystore normalmente e o salva; toda execução seguinte reaproveita
      # o mesmo arquivo, então os APKs passam a ter assinatura estável.
      # O caminho real (confirmado rodando `find` de verdade no runner,
      # ver DECISION-043) é `~/.config/.android/debug.keystore`, não
      # `~/.android/debug.keystore` — a v0.9.0/v0.9.10/v0.11.0/v0.12.0
      # cacheavam um caminho que o Gradle nunca escreve nesta toolchain,
      # então o cache nunca pegava e cada build continuava gerando uma
      # assinatura nova.
      - name: Cache Android debug keystore
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: android-debug-keystore-v2

      - name: Require existing Android signing key
        env:
          SIGNING_CACHE_HIT: ${{ steps.signing-cache.outputs.cache-hit }}
        run: |
          if [ "$SIGNING_CACHE_HIT" != "true" ] || [ ! -s ~/.config/.android/debug.keystore ]; then
            echo "Assinatura anterior indisponível. Build interrompido para preservar atualizações sem perda de dados."
            exit 1
          fi

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: flutter build apk --release
        working-directory: app
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "Configure a variável FIREBASE_API_KEY do projeto Firebase antes de buildar o login."
            exit 1
          fi
          flutter build apk --release --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"

      - name: Verify APK and update signing compatibility
        run: |
          tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apk=app/build/app/outputs/flutter-apk/app-release.apk
          previous="$RUNNER_TEMP/elementos-v0.29.0.apk"
          curl --fail --location --retry 3 \
            https://github.com/MarlonFer77/jogo-elementos/releases/download/v0.29.0/app-release.apk \
            --output "$previous"
          "$tools_dir/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/current-cert.txt"
          "$tools_dir/apksigner" verify --print-certs "$previous" > "$RUNNER_TEMP/previous-cert.txt"
          current=$(grep '^Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/current-cert.txt")
          baseline=$(grep '^Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/previous-cert.txt")
          if [ -z "$current" ] || [ "$current" != "$baseline" ]; then
            echo "Certificado diferente da release v0.29.0. Publicação insegura para atualização."
            exit 1
          fi
          echo "$current"
          "$tools_dir/aapt" dump badging "$apk" | grep -E '^(package:|sdkVersion:)'
          sha256sum "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: jogo-elementos-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
