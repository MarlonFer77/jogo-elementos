name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Runners are efêmeros — sem isso, o Gradle gera um keystore de debug
      # novo (chave aleatória) a cada execução, e cada APK fica com uma
      # assinatura diferente do anterior. Isso quebra qualquer instalação
      # "por cima" de uma versão já instalada (Android recusa update com
      # assinatura diferente) — ver DECISION-039. Cache fixa a mesma chave
      # entre execuções: a primeira execução depois deste passo gera o
      # keystore normalmente e o salva; toda execução seguinte reaproveita
      # o mesmo arquivo, então os APKs passam a ter assinatura estável.
      - name: Cache Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: flutter build apk --release
        working-directory: app
        run: flutter build apk --release

      - name: DEBUG - locate the real debug keystore
        run: |
          echo "HOME=$HOME"
          ls -la ~/.android/ 2>&1 || echo "~/.android does not exist"
          find / -xdev -iname "debug.keystore" 2>/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: jogo-elementos-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
